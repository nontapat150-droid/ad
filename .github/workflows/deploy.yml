name: 🚀 Deploy to Z.com (React + Node.js)

on:
  push:
    branches:
      - main
      - แก้ระบบเช็คอิน

jobs:
  build-and-deploy:
    name: 🌐 Build & Deploy via FTP
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🛠️ Build Frontend (React/Vite)
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npm run build
        
      - name: 📦 Install Backend Dependencies
        run: |
          cd backend
          npm install --production

      - name: 🔑 Create Firebase Service Account Key
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > backend/config/firebase-service-account.json

      - name: 📂 Deploy Frontend to public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./frontend/dist/
          server-dir: ./
          protocol: ftp
          port: 21
          log-level: minimal
          exclude: |
            **/.ftp-deploy-sync-state.json
            api/**
            cgi-bin/**

      - name: 📂 Deploy Backend (source code only)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./backend/
          server-dir: ./backend/
          protocol: ftp
          port: 21
          log-level: minimal
          exclude: |
            **/.env
            **/.ftp-deploy-sync-state.json
            **/node_modules/**

      - name: 📦 Deploy Backend node_modules via lftp
        run: |
          sudo apt-get install -y lftp
          lftp -u "${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }}" "${{ secrets.FTP_SERVER }}" <<EOF
          set ftp:ssl-allow no
          set net:timeout 30
          set net:max-retries 3
          set mirror:parallel-directories 1
          mirror --reverse --delete --verbose --parallel=5 \
            --exclude-glob .git* \
            ./backend/node_modules/ ./backend/node_modules/
          bye
          EOF

      - name: 🔄 Trigger Node.js Restart
        run: |
          mkdir -p backend/tmp
          touch backend/tmp/restart.txt
          
      - name: 📂 Upload Restart Trigger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./backend/tmp/
          server-dir: ./backend/tmp/
          protocol: ftp
          port: 21
          log-level: minimal