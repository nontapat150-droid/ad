name: 🚀 Deploy to Z.com (React + Node.js)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: 🌐 Build & Deploy via FTP
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🛠️ Build Frontend (React/Vite)
        run: |
          cd frontend
          npm install
          npm run build
        
      - name: 📂 Deploy Frontend to public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./frontend/dist/
          server-dir: ./
          protocol: ftp
          port: 21
          log-level: minimal
          # บล็อกไฟล์/โฟลเดอร์ฝั่ง Frontend ที่ไม่เกี่ยวกับเว็บ
          exclude: |
            **/.htaccess
            **/.ftp-deploy-sync-state.json

      - name: 📂 Deploy Backend to backend folder
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./backend/
          server-dir: ./backend/
          protocol: ftp
          port: 21
          log-level: minimal
          # บล็อกเฉพาะ node_modules และไฟล์ .env เพื่อป้องกันการอัปโหลดทับไฟล์การตั้งค่าบนเซิร์ฟเวอร์
          exclude: |
            **/node_modules/**
            **/.env
            **/.ftp-deploy-sync-state.json