name: 🚀 Deploy to Z.com (React + Node.js)

on:
  push:
    branches:
      - main
      - แก้ระบบเช็คอิน

jobs:
  build-and-deploy:
    name: 🌐 Build & Deploy via FTP
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🛠️ Build Frontend (React/Vite)
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npm run build
        
      - name: 📦 Install Backend Dependencies
        run: |
          cd backend
          npm install --production

      - name: 🔑 Create Firebase Service Account Key
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > backend/config/firebase-service-account.json

      - name: 📂 Deploy Frontend to public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./frontend/dist/
          server-dir: ./
          protocol: ftp
          port: 21
          log-level: minimal
          timeout: 600000
          exclude: |
            **/.ftp-deploy-sync-state.json
            api/**
            cgi-bin/**

      - name: 🗜️ Zip Backend node_modules
        run: |
          cd backend
          zip -q -r node_modules.zip node_modules

      - name: 📂 Deploy Backend Source Files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./backend/
          server-dir: ./backend/
          protocol: ftp
          port: 21
          log-level: minimal
          timeout: 600000
          exclude: |
            **/.env
            **/.ftp-deploy-sync-state.json
            **/node_modules/
            **/node_modules/**
            **/node_modules.zip

      - name: 📦 Upload node_modules.zip via FTP
        run: |
          curl --ftp-create-dirs \
            -T backend/node_modules.zip \
            "ftp://${{ secrets.FTP_SERVER }}/backend/node_modules.zip" \
            --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}"

      - name: 🔍 Debug unzip.php
        run: |
          curl -sS "ftp://${{ secrets.FTP_SERVER }}/unzip.php" --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}"

      - name: 🚀 Trigger Server Unzip & Restart
        run: |
          curl -sS "https://bonusais.com/unzip.php?secret=bount_deploy_secret_2026"
